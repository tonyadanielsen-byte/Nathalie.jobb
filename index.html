  .sheet { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; max-width: none; border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
}

.drop { border: 2px dashed var(--line-strong); border-radius: var(--radius); padding: 26px 18px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--surface-2); }

@media (max-width: 560px) { .brand h1 { font-size: 18px; } .next-when { font-size: 22px; } .pay-big { font-size: 28px; } }

/* ============================================================

async function boot() {

  window.claude.use('sample').then(s => { store.sample = s; if (currentView === 'importer') renderImport(); }).catch(() => {});

  try { db = await window.claude.use('db'); } catch {}

    const user = await window.claude.use('user');

    if (snap.exists) { state = normalize(snap.data()); lsSet(LS_STATE, state); setStatus('saved', 'Lagret'); }
    else if (!snap.metadata.fromCache) { state = null; setStatus('saved', 'Klar'); }

  }, err => { settled = true; clearTimeout(slow); setStatus('error', 'Ikke tilkoblet – viser lokal kopi'); store.mode = 'local'; state = normalize(lsGet(LS_STATE)) || legacyState(); renderAll(); });
}
function startLocal() {
  store.mode = 'local';
  state = normalize(lsGet(LS_STATE)) || legacyState();
  setStatus('local', 'Lagret i denne nettleseren');

}

/* ============================================================
   BEREGNINGER
   ============================================================ */
function codeOf(c) { return state.codes[c]; }
function isWork(c) { const k = codeOf(c); return !!k && k.hours > 0; }
function kindClass(c) {
  if (!c) return 'empty';
  const k = codeOf(c);
  if (!k) return 'unknown';
  return 'k-' + (k.kind || 'annet');
}
function chip(c, extra = '') {
  if (!c) return `<span class="chip empty ${extra}">–</span>`;
  const col = prefs.codeColors?.[c];
  if (col) return `<span class="chip custom ${extra}" style="--cc:${esc(col)}">${esc(c)}</span>`;
  return `<span class="chip ${kindClass(c)} ${extra}">${esc(c)}</span>`;
}
function timeRange(c) { const k = codeOf(c); return k && k.start && k.end ? `${k.start}–${k.end}` : ''; }
function toMin(t) { if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; }

function hourly() { return state.salary.annual / (state.salary.divisor || 1850); }

/* Tillegg for én vakt, minutt-for-minutt (5-min oppløsning). Ulønnet pause trekkes fra forholdsmessig. */
function shiftPay(iso, c) {
  const k = codeOf(c);
  const res = { hours: 0, kveld: 0, natt: 0, helg: 0, hoytid: 0, lang: 0, amt: { kveld: 0, natt: 0, helg: 0, hoytid: 0, lang: 0 } };

}
function planRange() {

}
function planMonths() {

  const sal = state.salary, fast = sal.annual * (sal.pct / 100) / 12;

    const earnedIn = sal.lag ? ymAdd(m, -1) : m;

  for (let i = 0; i < 7; i++) { const iso = toIso(addDays(d0, i)); const c = state.entries[iso] || ''; days.push({ iso, c }); if (codeOf(c)) hours += +codeOf(c).hours || 0; }
  const ts = state.meta.weekTS?.[mon];
  return { mon, days, hours, ts: ts == null || ts === '' ? null : +ts, mismatch: ts != null && ts !== '' && Math.abs(+ts - hours) > 0.01 };
}

function weekChart(weeks) {
  if (!weeks.length) return '';
  const W = 1000, H = 220, padL = 34, padB = 26, padT = 12, innerW = W - padL - 6, innerH = H - padB - padT;
  const target = state.salary.fullWeek * state.salary.pct / 100;
  const max = Math.max(60, ...weeks.map(w => w.hours));
  const step = innerW / weeks.length, bw = Math.max(4, step * 0.68);
  const y = v => padT + innerH - (v / max) * innerH;
  let g = '';
  for (let v = 0; v <= max; v += 10) g += `<line class="grid" x1="${padL}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const bars = weeks.map((w, i) => {
    const x = padL + i * step + (step - bw) / 2, h = Math.max(0, innerH - (y(w.hours) - padT));
    const lbl = (i % Math.ceil(weeks.length / 16) === 0) ? `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${isoWeek(parseIso(w.mon))}</text>` : '';
    return `<rect class="bar ${w.hours > target ? 'over' : ''}" x="${x}" y="${y(w.hours)}" width="${bw}" height="${h}" rx="2"><title>Uke ${isoWeek(parseIso(w.mon))}: ${nf1.format(w.hours)} t</title></rect>${lbl}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Timer per uke">${g}${bars}<line class="ref" x1="${padL}" x2="${W - 6}" y1="${y(target)}" y2="${y(target)}"/></svg>`;
}

function renderCalendar() {
  const el = document.getElementById('view-kalender');
  const months = planMonths();
  if (!calMonth || !months.includes(calMonth)) { const t = todayIso().slice(0, 7); calMonth = months.includes(t) ? t : months[0]; }
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = mondayOf(first), today = todayIso();
  const lastDay = new Date(y, m, 0);
  const end = addDays(mondayOf(lastDay), 6);
  let cells = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  cells = '<div></div>' + cells;
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
    if (dowIdx(d) === 0) cells += `<div class="wk">Uke ${isoWeek(d)}</div>`;
    const iso = toIso(d), c = state.entries[iso] || '', hn = holidayName(iso), other = d.getMonth() !== m - 1;
    const edited = state.original && (state.original[iso] || '') !== c && Object.keys(state.original).length;
    const cls = ['day', other ? 'other' : '', dowIdx(d) >= 5 ? 'weekend' : '', hn ? 'holiday' : '', iso === today ? 'today' : ''].join(' ');
    cells += `<button class="${cls}" data-edit="${iso}" aria-label="${d.getDate()}. ${MONTHS[d.getMonth()]}: ${c || 'ingen vakt'}${hn ? ', ' + hn : ''}">
      <span class="dn"><span>${d.getDate()}</span></span>${hn ? `<span class="hn">${esc(hn)}</span>` : ''}
      ${c || !other ? chip(c) : ''}${c && timeRange(c) ? `<span class="tm">${timeRange(c)}</span>` : ''}${edited ? '<span class="edited" title="Endret av deg"></span>' : ''}</button>`;
  }
  const a = monthAgg(calMonth);
  const idx = months.indexOf(calMonth);
  el.innerHTML = `
    ${draftBanner()}
    <div class="panel">
      <div class="cal-head">
        <div class="btn-row"><button class="btn" id="calPrev" ${idx <= 0 ? 'disabled' : ''} aria-label="Forrige måned">←</button>
        <span class="cal-title">${ymLabel(calMonth)}</span>
        <button class="btn" id="calNext" ${idx >= months.length - 1 ? 'disabled' : ''} aria-label="Neste måned">→</button></div>
        <div class="btn-row"><button class="btn" id="calToday">I dag</button><button class="btn" id="undoBtn" ${undoStack.length ? '' : 'disabled'}>Angre</button></div>
      </div>
      <div class="month-sum" style="margin:12px 0"><span>Timer <b>${nf1.format(a.hours)}</b></span><span>Vakter <b>${a.shifts}</b></span><span>Helgevakter <b>${a.weekend}</b></span><span>Timer etter kl. 17 <b>${nf1.format(a.kveld + a.natt)}</b></span><span>Tillegg <b>${kr(a.tillegg)}</b></span></div>
      <div class="cal-scroll"><div class="cal">${cells}</div></div>
      <p class="hint" style="margin:12px 0 0">Trykk på en dag for å endre vakten, for eksempel ved bytte. Endringer lagres med en gang. Prikken øverst til høyre viser dager som er endret fra opprinnelig plan.</p>
    </div>
    <div class="legend">${legendHtml()}</div>`;
  el.querySelector('#calPrev').onclick = () => { calMonth = months[idx - 1]; renderCalendar(); };
  el.querySelector('#calNext').onclick = () => { calMonth = months[idx + 1]; renderCalendar(); };
  el.querySelector('#calToday').onclick = () => { const t = todayIso().slice(0, 7); if (months.includes(t)) { calMonth = t; renderCalendar(); } else toast('I dag er utenfor planen.'); };
  el.querySelector('#undoBtn').onclick = undo;
}
function legendHtml() {
  const used = new Set(Object.values(state.entries));
  return Object.entries(state.codes).filter(([c]) => used.has(c)).map(([c, k]) => `<span>${chip(c)} ${esc(k.name)}${k.start ? ` ${k.start}–${k.end}` : ''} · ${hrs(k.hours)}</span>`).join('') +
    `<span><span class="chip" style="--c:var(--warn);--cb:var(--warn-soft)">H</span> Helligdag</span>`;
}

function payChart(pr) {
  if (!pr.length) return '';
  const W = 1000, H = 240, padL = 56, padB = 28, padT = 22, innerW = W - padL - 8, innerH = H - padB - padT;
  const max = Math.ceil(Math.max(...pr.map(p => p.brutto), 1) / 10000) * 10000;
  const step = innerW / pr.length, bw = Math.min(70, step * 0.6), y = v => padT + innerH - (v / max) * innerH;
  let g = '';
  for (let v = 0; v <= max; v += max / 4) g += `<line class="grid" x1="${padL}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${nf0.format(v / 1000)}k</text>`;
  const bars = pr.map((p, i) => {
    const x = padL + i * step + (step - bw) / 2;
    return `<g><title>${ymLabel(p.m)}: brutto ${kr(p.brutto)}, netto ${kr(p.netto)}</title>
      <rect class="b-fast" x="${x}" y="${y(p.fast)}" width="${bw}" height="${innerH + padT - y(p.fast)}"/>
      <rect class="b-till" x="${x}" y="${y(p.fast + p.tillegg)}" width="${bw}" height="${y(p.fast) - y(p.fast + p.tillegg)}"/>
      <line class="b-net" x1="${x - 4}" x2="${x + bw + 4}" y1="${y(p.netto)}" y2="${y(p.netto)}"/>
      <text class="lbl" x="${x + bw / 2}" y="${y(p.brutto) - 6}" text-anchor="middle">${nf0.format(p.brutto / 1000)}k</text>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${ymLabel(p.m, true)}</text></g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Brutto og netto per måned">${g}${bars}</svg>`;
}

function unknownCodes() { return [...new Set(Object.values(state.entries).filter(c => c && !state.codes[c]))]; }
function toHex(c) { if (/^#[0-9a-f]{6}$/i.test(c)) return c; const d = document.createElement('div'); d.style.color = c; document.body.appendChild(d); const rgb = getComputedStyle(d).color.match(/\d+/g) || [128, 128, 128]; d.remove(); return '#' + rgb.slice(0, 3).map(x => (+x).toString(16).padStart(2, '0')).join(''); }

async function exportJson() {
  const data = JSON.stringify(state, null, 2), filename = `turnus-${todayIso()}.json`;
  if (store.downloads) {
    try { await store.downloads.save({ filename, data: new Blob([data], { type: 'application/json' }) }); toast('Sikkerhetskopien er lastet ned.'); return; }
    catch (e) { if (e?.code === 'declined' || e?.code === 'dismissed') return; }
  }
  try { await navigator.clipboard.writeText(data); toast('Kunne ikke laste ned. Sikkerhetskopien er kopiert til utklippstavlen.'); }
  catch { toast('Nedlasting er ikke tilgjengelig her.'); }
}
function importJson(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { const s = normalize(JSON.parse(r.result)); if (!s || !s.entries) throw 0; pushUndo(); state = s; persist(); renderAll(); toast('Planen er gjenopprettet.', true); } catch { toast('Filen kunne ikke leses. Velg en sikkerhetskopi laget av denne appen.'); } };
  r.readAsText(file);
}

Hvis planen har en forklaring av vaktkodene (tider og timer), ta den med i "legend".
Kjente koder fra før (bare til hjelp): ${known}.
${imp.text.trim() ? `Tekst limt inn fra planen:\n"""\n${imp.text.trim().slice(0, 20000)}\n"""\n` : ''}
Svar med KUN JSON i dette formatet:
{"title":"navn på planen eller null","person":"navn eller null","weeks":[{"week":2,"monday":"YYYY-MM-DD","shifts":["D","","A","F1","","LL","LL"],"ts":44}],"legend":[{"code":"D","name":"Dagvakt","start":"07:30","end":"15:00","hours":7}],"notes":"kort merknad på norsk om noe var usikkert, ellers tom"}
"monday" er datoen for mandagen i uka (ISO-uke).`;
  imp.ctl = new AbortController();
  try {
    const res = await store.sample.json(prompt, { images: imp.files.length ? imp.files : undefined, modelTier: 'complex', signal: imp.ctl.signal, onText: ({ text }) => { imp.progress = 'Claude leser …\n' + text.slice(-600); const p = document.getElementById('impProgress'); if (p) { p.textContent = imp.progress; p.scrollTop = p.scrollHeight; } } });
    imp.result = validateImport(res);
    imp.progress = '';
    if (!imp.result.weeks.length) { imp.error = 'Claude fant ingen uker i planen. Prøv et skarpere bilde der hele tabellen er med.'; imp.result = null; }
  } catch (e) {
    imp.progress = '';
    imp.error = e?.code === 'cancelled' ? 'Avbrutt.' : e?.code === 'not_granted' ? 'Du må gi siden lov til å spørre Claude.' : e?.code === 'rate_limited' ? 'For mange forespørsler akkurat nå. Vent litt og prøv igjen.' : e?.code === 'image_rejected' ? 'Et av bildene kunne ikke leses. Bruk JPG eller PNG.' : e?.code === 'invalid_json' ? 'Svaret kunne ikke tolkes. Prøv igjen, gjerne med færre bilder om gangen.' : (e?.message || 'Ukjent feil.');
  }
  imp.busy = false; imp.ctl = null;
  renderImport();
}
function validateImport(res) {
  const out = { title: res?.title || null, notes: String(res?.notes || ''), legend: [], weeks: [] };
  for (const w of Array.isArray(res?.weeks) ? res.weeks : []) {
    if (!w || !/^\d{4}-\d{2}-\d{2}$/.test(w.monday || '') || !Array.isArray(w.shifts)) continue;
    let mon = parseIso(w.monday); if (dowIdx(mon) !== 0) mon = mondayOf(mon);
    const shifts = Array.from({ length: 7 }, (_, i) => String(w.shifts[i] ?? '').trim().toUpperCase().replace(/^[-–—]$/, ''));
    out.weeks.push({ monday: toIso(mon), shifts, ts: w.ts == null || w.ts === '' || isNaN(+w.ts) ? null : +w.ts });
  }
  out.weeks.sort((a, b) => a.monday.localeCompare(b.monday));
  for (const l of Array.isArray(res?.legend) ? res.legend : []) {
    if (!l?.code) continue;
    out.legend.push({ code: String(l.code).trim().toUpperCase(), name: String(l.name || ''), start: /^\d{1,2}:\d{2}$/.test(l.start || '') ? l.start.padStart(5, '0') : '', end: /^\d{1,2}:\d{2}$/.test(l.end || '') ? l.end.padStart(5, '0') : '', hours: +l.hours || 0 });
  }
  return out;
}
function importPreviewHtml() {
  const r = imp.result, codes = { ...(state?.codes || DEFAULT_CODES) };
  r.legend.forEach(l => { if (!codes[l.code]) codes[l.code] = { name: l.name, start: l.start, end: l.end, hours: l.hours, kind: 'annet' }; });
  const hoursOf = c => codes[c] ? +codes[c].hours || 0 : 0;
  const unknown = new Set(), qs = [];
  let mism = 0, changed = 0;
  const rows = r.weeks.map((w, wi) => {
    let h = 0;
    const cells = w.shifts.map((c, i) => {
      const iso = toIso(addDays(parseIso(w.monday), i));
      if (c === '?') qs.push(iso); else if (c && !codes[c]) unknown.add(c);
      h += hoursOf(c);
      const was = state?.entries?.[iso] || '';
      const ch = state && was !== c; if (ch) changed++;
      return `<td class="c diffcell ${ch ? 'changed' : ''}"><button class="cellbtn editable" data-impcell="${wi}:${i}">${c === '?' ? '<span class="chip unknown">?</span>' : chipWith(c, codes)}</button>${ch && was ? `<span class="was">${esc(was)}</span>` : ''}</td>`;
    }).join('');
    const bad = w.ts != null && Math.abs(w.ts - h) > 0.01; if (bad) mism++;
    return `<tr><td class="wk-cell">Uke ${isoWeek(parseIso(w.monday))}</td><td class="num">${fmtDM(parseIso(w.monday))}.${w.monday.slice(2, 4)}</td>${cells}<td class="r">${nf1.format(h)}</td><td class="r">${w.ts == null ? '–' : `<span class="${bad ? 'mismatch' : 'ok'}">${nf1.format(w.ts)} ${bad ? '⚠' : '✓'}</span>`}</td></tr>`;
  }).join('');
  const newLegend = r.legend.filter(l => !(state?.codes || {})[l.code]);
  return `<div class="panel">
    <div class="panel-head"><div><h2>Sjekk det Claude leste</h2><span class="hint">${r.weeks.length} uker, ${fmtDM(parseIso(r.weeks[0].monday))}.${r.weeks[0].monday.slice(0, 4)} – ${fmtDM(addDays(parseIso(r.weeks[r.weeks.length - 1].monday), 6))}.${r.weeks[r.weeks.length - 1].monday.slice(0, 4)}. Trykk på en vakt for å rette den. ${state ? 'Endringer mot nåværende plan er markert.' : ''}</span></div></div>
    <div style="display:grid;gap:10px;margin-bottom:12px">
      ${r.notes ? `<div class="banner info"><div class="grow"><strong>Merknad fra Claude:</strong> ${esc(r.notes)}</div></div>` : ''}
      ${mism ? `<div class="banner bad"><div class="grow"><strong>${mism} uker stemmer ikke med timesummen.</strong> Sammenlign med bildet og rett vaktene, eller sjekk timene for vaktkodene.</div></div>` : r.weeks.some(w => w.ts != null) ? '<div class="banner info"><div class="grow"><strong>Alle ukene stemmer med timesummen i planen.</strong></div></div>' : ''}
      ${qs.length ? `<div class="banner bad"><div class="grow"><strong>${qs.length} celler var uleselige (?).</strong> Rett dem før du lagrer.</div></div>` : ''}
      ${unknown.size ? `<div class="banner"><div class="grow"><strong>Ukjente koder: ${[...unknown].map(esc).join(', ')}.</strong> De legges til som nye vaktkoder med 0 timer. Fyll inn tider og timer under Oppsett etterpå.</div></div>` : ''}
      ${newLegend.length ? `<div class="banner info"><div class="grow"><strong>Nye vaktkoder fra forklaringen:</strong> ${newLegend.map(l => `${esc(l.code)} (${esc(l.start)}–${esc(l.end)}, ${nf1.format(l.hours)} t)`).join(', ')}. De legges til.</div></div>` : ''}
    </div>
    <div class="table-wrap"><table><thead><tr><th>Uke</th><th>Mandag</th>${DOW.map(d => `<th class="c">${d}</th>`).join('')}<th class="r">Timer</th><th class="r">TS</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn primary" id="applyImport">${imp.mode === 'replace' ? 'Lagre som ny plan' : 'Oppdater disse ukene'}</button>
      <label class="check"><input type="checkbox" id="impFinal" checked> Merk som endelig plan</label>
      ${r.legend.length ? `<label class="check"><input type="checkbox" id="impLegend" checked> Bruk tidene fra planens kodeforklaring</label>` : ''}
      <button class="btn ghost" id="discardImport">Forkast</button>
    </div>
  </div>`;
}
function chipWith(c, codes) { const saved = state; if (!state) state = { codes }; else state = { ...state, codes }; const h = chip(c); state = saved; return h; }
function bindPreview() {
  const box = document.getElementById('impResult'); if (!box || !imp.result) return;
  box.querySelectorAll('[data-impcell]').forEach(b => b.onclick = e => { const [wi, di] = b.dataset.impcell.split(':').map(Number); openPicker(b, { importCell: [wi, di] }); });
  box.querySelector('#applyImport').onclick = applyImport;
  box.querySelector('#discardImport').onclick = () => { imp.result = null; renderImport(); };
}
function applyImport() {
  const r = imp.result;
  if (r.weeks.some(w => w.shifts.includes('?'))) { toast('Rett cellene med ? først.'); return; }
  const useLegend = document.getElementById('impLegend')?.checked;
  const final = document.getElementById('impFinal')?.checked;
  pushUndo();
  const base = state ? clone(state) : normalize({ meta: {}, entries: {} });
  if (imp.mode === 'replace') { base.entries = {}; base.meta.weekTS = {}; }
  r.legend.forEach(l => {
    const exists = base.codes[l.code];
    if (!exists) base.codes[l.code] = { name: l.name || l.code, start: l.start, end: l.end, hours: l.hours, kind: guessKind(l) };
    else if (useLegend) Object.assign(exists, { name: l.name || exists.name, start: l.start || exists.start, end: l.end || exists.end, hours: l.hours || exists.hours });
  });
  r.weeks.forEach(w => {
    const mon = parseIso(w.monday);
    w.shifts.forEach((c, i) => {
      const iso = toIso(addDays(mon, i));
      if (c) base.entries[iso] = c; else delete base.entries[iso];
      if (c && !base.codes[c]) base.codes[c] = { name: c, start: '', end: '', hours: 0, kind: 'annet' };
    });
    if (w.ts != null) base.meta.weekTS[w.monday] = w.ts; else delete base.meta.weekTS[w.monday];
  });
  base.original = { ...base.entries };
  if (r.title && imp.mode === 'replace') base.meta.name = r.title;
  base.meta.status = final ? 'endelig' : 'utkast';
  base.meta.note = final ? '' : 'Importert, men ikke merket som endelig.';
  state = base; imp.result = null; imp.files = []; imp.text = '';
  persist();
  calMonth = r.weeks[0].monday.slice(0, 7);
  currentView = 'kalender'; renderAll();
  toast('Planen er lagret.', true);
}
function guessKind(l) {
  const s = toMin(l.start), e = toMin(l.end);
  if (!l.hours) return /fe|ferie/i.test(l.name) ? 'ferie' : 'fri';
  if (l.hours >= 11) return 'lang';
  if (s != null && e != null && (e <= s || s >= 20 * 60)) return 'natt';
  if (s != null && s >= 12 * 60) return 'kveld';
  return 'dag';
}

/* ---------- Vaktvelger ---------- */
let pickerTarget = null;
function openPicker(anchor, target) {
  pickerTarget = target;
  const layer = document.getElementById('pickerLayer'), sheet = document.getElementById('picker');
  let cur, title;
  if (target.iso) { cur = state.entries[target.iso] || ''; const d = parseIso(target.iso); title = `${DOW_LONG[dowIdx(d)][0].toUpperCase()}${DOW_LONG[dowIdx(d)].slice(1)} ${d.getDate()}. ${MONTHS[d.getMonth()]}`; }
  else { const [wi, di] = target.importCell; cur = imp.result.weeks[wi].shifts[di]; const d = addDays(parseIso(imp.result.weeks[wi].monday), di); title = `Rett ${DOW_LONG[di]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`; }
  const hn = target.iso ? holidayName(target.iso) : '';
  const codes = state?.codes || DEFAULT_CODES;
  const opts = Object.entries(codes).map(([c, k]) => `<button class="opt" data-pick="${esc(c)}" aria-pressed="${cur === c}">${chip(c)}<small>${k.start ? `${k.start}–${k.end}` : esc(k.name)}</small><small>${hrs(k.hours)}</small></button>`).join('');
  sheet.innerHTML = `<div class="panel-head" style="margin:0"><h3 id="pickerTitle">${esc(title)}</h3>${hn ? `<span class="hint" style="color:var(--warn)">${esc(hn)}</span>` : ''}</div>
    <div class="opts">${opts}<button class="opt" data-pick="" aria-pressed="${!cur}"><span class="chip empty">–</span><small>Ingen vakt</small><small>0 t</small></button></div>
    <div class="field"><label for="customCode">Annen kode</label><div class="btn-row"><input class="input" id="customCode" style="flex:1;min-width:0" maxlength="6" placeholder="f.eks. FE"><button class="btn" id="customOk">Bruk</button></div></div>
    <button class="btn" id="pickerClose">Lukk</button>`;
  layer.hidden = false;
  if (window.innerWidth > 640) {
    const r = anchor.getBoundingClientRect(), sw = 320, sh = Math.min(sheet.offsetHeight, window.innerHeight * 0.78);
    let left = Math.min(Math.max(12, r.left), window.innerWidth - sw - 12);
    let top = r.bottom + 6; if (top + sh > window.innerHeight - 12) top = Math.max(12, r.top - sh - 6);
    sheet.style.left = left + 'px'; sheet.style.top = top + 'px';
  }
  sheet.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pick(b.dataset.pick));
  sheet.querySelector('#customOk').onclick = () => { const v = sheet.querySelector('#customCode').value.trim().toUpperCase(); if (v) pick(v); };
  sheet.querySelector('#customCode').onkeydown = e => { if (e.key === 'Enter') sheet.querySelector('#customOk').click(); };
  sheet.querySelector('#pickerClose').onclick = closePicker;
  (sheet.querySelector('[aria-pressed="true"]') || sheet.querySelector('.opt')).focus();
}
function closePicker() { document.getElementById('pickerLayer').hidden = true; pickerTarget = null; }
function pick(code) {
  const t = pickerTarget; closePicker(); if (!t) return;
  if (t.importCell) { const [wi, di] = t.importCell; imp.result.weeks[wi].shifts[di] = code; renderImport(); return; }
  pushUndo();
  if (code) state.entries[t.iso] = code; else delete state.entries[t.iso];
  if (code && !state.codes[code]) { state.codes[code] = { name: code, start: '', end: '', hours: 0, kind: 'annet' }; toast(`Ny kode ${code} er lagt til. Fyll inn tider under Oppsett.`); }
  persist(); renderAll();
}
function pushUndo() { if (!state) return; undoStack.push(JSON.stringify(state)); if (undoStack.length > 30) undoStack.shift(); }
function undo() { const s = undoStack.pop(); if (!s) return; state = JSON.parse(s); persist(); renderAll(); toast('Angret.'); }

/* ---------- Diverse ---------- */
let toastTimer;
function toast(msg, withUndo) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo && undoStack.length ? '<button id="toastUndo">Angre</button>' : ''}`;
  t.hidden = false;
  const u = t.querySelector('#toastUndo'); if (u) u.onclick = () => { undo(); t.hidden = true; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4500);
}
const hostTheme = document.documentElement.getAttribute('data-theme');
function applyPrefs() {
  const root = document.documentElement;
  if (prefs.theme === 'light' || prefs.theme === 'dark') root.setAttribute('data-theme', prefs.theme);
  else if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme');
  const [l, d] = ACCENTS[prefs.accent] || ACCENTS.teal;
  root.style.setProperty('--accent-l', l); root.style.setProperty('--accent-d', d);
  document.body.classList.toggle('compact', prefs.density === 'compact');
  document.body.classList.toggle('hide-times', !prefs.showTimes);
}
function go(view) {
  currentView = view;
  try { history.replaceState(null, '', '#' + view); } catch { location.hash = view; }
  renderAll(); window.scrollTo({ top: 0 });
}
function bindChrome() {
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => go(t.dataset.view));
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-goto]'); if (g) { go(g.dataset.goto); return; }
    const ed = e.target.closest('[data-edit]'); if (ed && state) { openPicker(ed, { iso: ed.dataset.edit }); }
  });
  document.getElementById('pickerBackdrop').onclick = closePicker;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.target.closest('input,textarea')) { e.preventDefault(); undo(); } });
  document.getElementById('useDraftBtn').onclick = () => { state = legacyState(); persist(); renderAll(); };
  const h = location.hash.slice(1);
  if (['oversikt', 'kalender', 'uker', 'lonn', 'importer', 'oppsett'].includes(h)) currentView = h;
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== currentView && document.getElementById('view-' + v)) { currentView = v; renderAll(); } });
}
boot();
